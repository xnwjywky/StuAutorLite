[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --color=yes -p no:warnings
markers =
    anyio: async tests using httpx
    slow: slow running tests (real training / network download); skipped by default, run with --runslow
# 全局测试超时（防死循环/挂起长时间占用资源）：单测 120s 硬上限
timeout = 120
timeout_method = thread
asyncio_mode = auto
